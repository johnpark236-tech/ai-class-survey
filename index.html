<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f5f3ee" />
<title>AI 수업 사전 설문</title>
<style>
:root{
  --font-scale:1;
  --bg:#f5f3ee;--card:#fffdf8;--ink:#1f2933;--muted:#6f7782;--line:#e7e2d9;
  --accent:#728b7a;--accent2:#dce8df;--danger:#a75b5b;--shadow:0 18px 50px rgba(38,48,42,.10)
}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f4f2ec 0%,#eef3ef 100%);
font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink);font-size:calc(16px * var(--font-scale))}
button,input,textarea{font:inherit}.app{min-height:100svh;display:flex;justify-content:center;padding:18px}
.phone{width:min(100%,430px);min-height:calc(100svh - 36px);background:rgba(255,253,248,.94);border:1px solid rgba(255,255,255,.8);
border-radius:30px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:16px 18px 8px}.brand{font-weight:800;letter-spacing:-.03em;line-height:1.2}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.font-controls{display:flex;align-items:center;gap:4px;background:#f2f0ea;border:1px solid var(--line);border-radius:999px;padding:4px}.font-btn{border:0;background:transparent;min-width:34px;height:32px;border-radius:999px;cursor:pointer;color:var(--ink);font-weight:800}.font-btn.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.admin-link{border:0;background:transparent;color:var(--muted);font-size:calc(13px * var(--font-scale));padding:8px 0;cursor:pointer}
.progress-wrap{padding:0 20px}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:calc(12px * var(--font-scale));margin-bottom:8px;gap:10px}
.progress{height:7px;background:#ebe8e0;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:.25s}
main{flex:1;display:flex;flex-direction:column;padding:26px 22px 22px;min-width:0}.eyebrow{font-size:calc(13px * var(--font-scale));color:var(--accent);font-weight:800;margin-bottom:10px;line-height:1.4}
h1{font-size:calc(27px * var(--font-scale));line-height:1.3;letter-spacing:-.035em;margin:0 0 14px;word-break:keep-all;overflow-wrap:anywhere}p.desc{color:var(--muted);line-height:1.75;margin:0 0 22px;font-size:calc(15px * var(--font-scale));word-break:keep-all;overflow-wrap:anywhere}
.options{display:grid;gap:11px}.option,.primary,.secondary{border-radius:16px;min-height:calc(56px * var(--font-scale));padding:calc(15px * var(--font-scale)) calc(16px * var(--font-scale));border:1px solid var(--line);background:#fff;text-align:left;cursor:pointer;transition:.15s;line-height:1.5;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.option:hover,.option.selected{border-color:var(--accent);background:var(--accent2);transform:translateY(-1px)}
.option input{margin-right:10px}.field,textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:calc(16px * var(--font-scale));outline:none;font-size:calc(16px * var(--font-scale));line-height:1.5}
.field:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(114,139,122,.12)}
textarea{min-height:120px;resize:vertical}.nav{display:flex;gap:10px;margin-top:auto;padding-top:24px}.primary,.secondary{text-align:center;font-weight:800}
.primary{background:var(--ink);color:white;border-color:var(--ink);flex:1}.secondary{background:#fff;color:var(--ink)}
.note{font-size:calc(12px * var(--font-scale));color:var(--muted);line-height:1.65;margin-top:12px;word-break:keep-all}.hidden{display:none!important}
.hero{padding-top:26px}.hero-badge{display:inline-flex;gap:7px;align-items:center;background:var(--accent2);padding:8px 12px;border-radius:999px;color:#4f6b58;font-weight:800;font-size:calc(13px * var(--font-scale));line-height:1.4}
.big-emoji{font-size:52px;margin:18px 0 8px}.center{text-align:center}.result-card{margin-top:18px;padding:18px;border-radius:18px;background:#f3f7f4;border:1px solid #dfe9e1}
.admin{width:min(100%,980px);min-height:calc(100svh - 36px);background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:22px}
.admin h2{margin:6px 0 4px;font-size:calc(24px * var(--font-scale));line-height:1.35}.admin-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.mini{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 12px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}.stat{background:#f6f5f0;border:1px solid var(--line);padding:16px;border-radius:16px}.stat b{font-size:calc(24px * var(--font-scale));display:block}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:12px;border-bottom:1px solid var(--line);font-size:calc(13px * var(--font-scale));text-align:left;vertical-align:top;line-height:1.5;word-break:keep-all}th{background:#f7f6f2;position:sticky;top:0}
.modal{position:fixed;inset:0;background:rgba(20,28,24,.36);display:grid;place-items:center;padding:18px;z-index:20}.modal-card{width:min(100%,390px);background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2933;color:white;padding:11px 15px;border-radius:999px;font-size:13px;z-index:30}
@media(min-width:800px){.app.admin-mode{padding:28px}.admin{padding:28px}} 
@media(max-height:720px){main{padding-top:16px}}
@media(max-width:430px){.app{padding:0}.phone{width:100%;min-height:100svh;border-radius:0}.top{padding:14px 14px 8px}.brand{font-size:calc(14px * var(--font-scale))}.font-btn{min-width:32px;height:30px}.admin-link{padding:6px 0}main{padding:22px 18px 20px}.progress-wrap{padding:0 16px}.nav{gap:8px}.stats{grid-template-columns:1fr}.admin{border-radius:0;min-height:100svh}}
body[data-font='large'] .phone{width:min(100%,470px)}
body[data-font='xlarge'] .phone{width:min(100%,500px)}
body[data-font='xxlarge'] .phone{width:min(100%,530px)}
body[data-font='large'] .top,
body[data-font='xlarge'] .top,
body[data-font='xxlarge'] .top{align-items:start}
body[data-font='xlarge'] .top,
body[data-font='xxlarge'] .top{grid-template-columns:1fr}
body[data-font='xlarge'] .top-actions,
body[data-font='xxlarge'] .top-actions{justify-content:space-between}
body[data-font='xlarge'] .options{gap:13px}
body[data-font='xxlarge'] .options{gap:15px}
body[data-font='xxlarge'] .font-controls{width:100%;justify-content:space-between;border-radius:18px}
body[data-font='xxlarge'] .font-btn{flex:1;min-width:0;height:42px}
body[data-font='xxlarge'] .nav{flex-direction:column}
body[data-font='xxlarge'] .secondary,
body[data-font='xxlarge'] .primary{width:100%}
body[data-font='xxlarge'] .hero-badge{border-radius:16px}
body[data-font='xxlarge'] .admin-toolbar{flex-direction:column}
body[data-font='xxlarge'] .mini{width:100%;min-height:52px}
body[data-font='xxlarge'] .stats{grid-template-columns:1fr}
.other-ai-box{margin-top:14px;padding:14px;border:1px dashed var(--line);border-radius:16px;background:#faf9f5}.other-ai-row{display:flex;gap:8px;align-items:stretch}.other-ai-row .field{min-width:0;flex:1}.add-ai-btn{border:1px solid var(--accent);background:var(--accent2);color:#3f5c48;border-radius:14px;padding:0 14px;font-weight:800;cursor:pointer;white-space:nowrap}.custom-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.custom-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:calc(13px * var(--font-scale));cursor:pointer}.limit-note{margin-top:10px;font-size:calc(12px * var(--font-scale));color:var(--muted)}
body[data-font='xxlarge'] .other-ai-row{flex-direction:column}
body[data-font='xxlarge'] .add-ai-btn{min-height:54px}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="phone" id="surveyShell">
    <div class="top">
      <div class="brand">AI CLASS CHECK-IN</div>
      <div class="top-actions">
        <div class="font-controls" aria-label="글씨 크기 조절">
          <button class="font-btn" data-font-size="small" aria-label="글씨 작게">A−</button>
          <button class="font-btn" data-font-size="normal" aria-label="기본 글씨">A</button>
          <button class="font-btn" data-font-size="large" aria-label="글씨 크게 1단계">A+</button>
          <button class="font-btn" data-font-size="xlarge" aria-label="글씨 크게 2단계">A++</button>
          <button class="font-btn" data-font-size="xxlarge" aria-label="글씨 크게 3단계">A+++</button>
        </div>
        <button class="admin-link" id="adminBtn">강사 접속</button>
      </div>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-head"><span id="stepText">시작</span><span>약 3분</span></div>
      <div class="progress"><i id="progressBar"></i></div>
    </div>
    <main id="screen"></main>
  </section>

  <section class="admin hidden" id="adminShell">
    <div class="top" style="padding:0 0 10px">
      <button class="admin-link" id="backBtn">← 설문으로 돌아가기</button>
      <div class="font-controls" aria-label="글씨 크기 조절">
        <button class="font-btn" data-font-size="small" aria-label="글씨 작게">A−</button>
        <button class="font-btn" data-font-size="normal" aria-label="기본 글씨">A</button>
        <button class="font-btn" data-font-size="large" aria-label="글씨 크게 1단계">A+</button>
        <button class="font-btn" data-font-size="xlarge" aria-label="글씨 크게 2단계">A++</button>
        <button class="font-btn" data-font-size="xxlarge" aria-label="글씨 크게 3단계">A+++</button>
      </div>
    </div>
    <h2>강사 관리 화면</h2>
    <p class="desc" id="adminSourceDesc">Google Sheet에 저장된 최신 10문항 설문 응답을 확인합니다.</p>
    <div class="stats">
      <div class="stat"><span>총 응답</span><b id="statTotal">0</b></div>
      <div class="stat"><span>오늘 응답</span><b id="statToday">0</b></div>
      <div class="stat"><span>AI 미경험</span><b id="statBeginner">0</b></div>
    </div>
    <div class="admin-toolbar">
      <button class="mini" id="exportBtn">CSV 내보내기</button>
      <button class="mini" id="refreshBtn">새로고침</button>
      <button class="mini" id="clearBtn">전체 삭제</button>
    </div>
    <div class="table-wrap"><table><thead><tr>
      <th>접수일시</th><th>이름</th><th>AI 사용 빈도</th><th>사용 AI</th><th>활용 희망</th><th>직접 해본 활동</th><th>배우고 싶은 것</th><th>노트북 지참</th><th>수업 목표</th>
    </tr></thead><tbody id="adminBody"></tbody></table></div>
    <p class="note">※ Google Apps Script 웹앱이 연결되면 모든 학습자의 응답을 Google Sheet에서 통합 조회합니다. 연결 전에는 브라우저에 임시 저장됩니다.</p>
  </section>
</div>

<div class="modal hidden" id="loginModal">
  <div class="modal-card">
    <div class="eyebrow">INSTRUCTOR</div>
    <h1 style="font-size:23px">강사 비밀번호</h1>
    <p class="desc">관리 화면을 보려면 비밀번호를 입력하세요.</p>
    <input class="field" id="passwordInput" type="password" inputmode="text" autocomplete="current-password" placeholder="비밀번호 입력" />
    <div class="nav"><button class="secondary" id="cancelLogin">취소</button><button class="primary" id="loginBtn">접속</button></div>
    <p class="note" id="loginMsg"></p>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script src="config.js"></script>
<script>
const API_URL=(window.AI_SURVEY_API_URL||'').trim();
let adminRows=[];
let adminPassword='';
const STORAGE_KEY='aiClassSurvey.responses.v1';
const FONT_KEY='aiClassSurvey.fontSize.v1';
const COMPLETED_KEY='aiClassSurvey.completed.v1';
const ADMIN_HASH='94a2118180637b8733ceca2c33f7ad4b1383c143d0c89eeddea2653b7526aa0e'; // 강사 비밀번호 #2040의 SHA-256
const profileQuestion={id:'name',type:'text',required:true,title:'성함을 알려주세요.',desc:'설문 결과를 구분하기 위한 기본 정보입니다.',placeholder:'예: 김민수'};
const questions=[
 {id:'digital',type:'single',required:true,title:'스마트폰이나 컴퓨터 사용은 어느 정도 편하신가요?',opts:['많이 어렵다','조금 어렵다','보통이다','익숙하다']},
 {id:'aiExp',type:'single',required:true,title:'ChatGPT, Gemini 같은 AI를 얼마나 사용해 보셨나요?',opts:['전혀 사용해 본 적이 없다','1~2번 정도만 사용해 봤다','가끔 사용한다','자주 사용한다']},
 {id:'tools',type:'multi',title:'사용해 본 AI가 있다면 모두 골라주세요.',desc:'목록에 없는 AI는 아래 + 버튼으로 직접 추가할 수 있습니다.',opts:['ChatGPT','Gemini','Copilot','Claude','이미지·영상 AI','잘 모르겠다']},
 {id:'prompt',type:'single',required:true,title:'AI가 원하는 답을 주지 않을 때 어디까지 해보셨나요?',opts:['AI를 거의 사용하지 않았다','같은 질문을 다시 해봤다','조건이나 예시를 추가해 질문해봤다','여러 번 수정하며 결과를 비교해봤다']},
 {id:'purpose',type:'multi',required:true,title:'앞으로 AI를 어디에 활용하고 싶으신가요?',desc:'관심 있는 항목을 모두 골라주세요.',opts:['생활정보','업무','문서작성','공부·교육','이미지·영상','취업·창업','취미','기타']},
 {id:'done',type:'multi',required:true,title:'AI로 직접 해본 활동을 모두 골라주세요.',opts:['질문·검색','글쓰기','번역','문서요약','이미지 생성','영상 생성','데이터 분석','아직 없음']},
 {id:'verify',type:'single',required:true,title:'AI가 알려준 정보가 맞는지 어떻게 확인하시나요?',opts:['확인해 본 적이 없다','거의 확인하지 않는다','중요한 내용만 확인한다','다른 자료와 비교해 확인한다']},
 {id:'learn',type:'multi',required:true,max:3,title:'이번 수업에서 가장 배우고 싶은 것을 골라주세요.',desc:'최대 3개까지 선택할 수 있습니다.',opts:['AI 기본 사용법','좋은 질문 만드는 법','문서·업무 활용','생활·정보검색 활용','이미지·영상 만들기','자동화·고급 활용']},
 {id:'goal',type:'textarea',required:true,title:'수업이 끝났을 때 “이것만은 할 수 있었으면 좋겠다”는 것이 있나요?',desc:'짧게 한 문장으로 적어주세요.',placeholder:'예: AI로 업무 문서를 빠르게 작성해 보고 싶어요.'},
 {id:'practice',type:'single',required:true,title:'AI 실습을 위해 개인 노트북을 가져오실 수 있나요?',desc:'스마트폰은 수업에 꼭 필요합니다. 여기서는 노트북 지참 가능 여부만 확인합니다.',opts:['네, 노트북을 가져올 수 있어요','노트북이 없어 스마트폰으로 참여할게요','노트북은 있지만 가져오기 어려워요','아직 지참 가능 여부를 확인해야 해요']}
];
const steps=[profileQuestion,...questions];
let step=-1, answers={customTools:[]};
let isSubmitting=false;

const $=s=>document.querySelector(s);
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}
function getResponses(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]}}
function saveResponses(v){localStorage.setItem(STORAGE_KEY,JSON.stringify(v))}
function getCompletedSubmission(){
 try{return JSON.parse(localStorage.getItem(COMPLETED_KEY)||'null')}catch{return null}
}
function markCompletedSubmission(rec){
 localStorage.setItem(COMPLETED_KEY,JSON.stringify({
   id:rec.id||'',
   name:rec.name||'',
   completedAt:new Date().toISOString()
 }));
}
function renderAlreadyCompleted(info){
 $('#progressWrap').classList.add('hidden');
 $('#screen').innerHTML=
 '<div class="center hero">'+
   '<div class="big-emoji">✅</div>'+
   '<h1>이미 설문 제출이<br>완료되었습니다.</h1>'+
   '<p class="desc">'+(info&&info.name?esc(info.name)+' 님, ':'')+'추가 제출은 필요하지 않습니다.<br>수정이 필요한 경우 강사에게 문의해 주세요.</p>'+
   '<div class="result-card"><b>제출 완료</b>'+
   '<div class="note">같은 스마트폰·같은 브라우저에서는 중복 제출을 막고 있습니다.</div></div>'+
 '</div>';
}
function applyFontSize(size){
 const map={small:.92,normal:1,large:1.18,xlarge:1.36,xxlarge:1.55};
 const chosen=map[size]?size:'normal';
 document.documentElement.style.setProperty('--font-scale',map[chosen]);
 document.body.dataset.font=chosen;
 localStorage.setItem(FONT_KEY,chosen);
 document.querySelectorAll('.font-btn').forEach(b=>b.classList.toggle('active',b.dataset.fontSize===chosen));
}
function bindFontControls(){
 document.querySelectorAll('.font-btn').forEach(b=>b.onclick=()=>applyFontSize(b.dataset.fontSize));
 applyFontSize(localStorage.getItem(FONT_KEY)||'normal');
}
async function apiCall(action,payload={}){
 if(!API_URL) throw new Error('API_NOT_CONFIGURED');
 const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});
 const data=await res.json();
 if(!data.ok) throw new Error(data.error||'API_ERROR');
 return data;
}
function intro(){
 const completed=getCompletedSubmission();
 if(completed){renderAlreadyCompleted(completed);return}
 step=-1;
 $('#progressWrap').classList.remove('hidden');
 $('#stepText').textContent='시작'; $('#progressBar').style.width='0%';
 $('#screen').innerHTML=
 '<div class="hero">'+
   '<span class="hero-badge">🌿 AI 수업 사전 체크</span>'+
   '<div class="big-emoji">👋</div>'+
   '<h1>AI 수업,<br>나에게 딱 맞게 시작해요.</h1>'+
   '<p class="desc">시험이 아닙니다. 평소 AI 경험과 이번 수업에서 필요한 내용을 편하게 알려주세요.</p>'+
   '<div class="result-card"><b>이름 입력 + 핵심 10문항 · 약 3분</b>'+
   '<div class="note">📱 스마트폰은 수업에 꼭 필요합니다. 노트북 지참 가능 여부는 마지막 문항에서 확인합니다.</div></div>'+
 '</div>'+
 '<div class="nav"><button class="primary" id="startBtn">설문 시작하기 →</button></div>';
 $('#startBtn').onclick=()=>{step=0;renderQuestion()};
}
function renderQuestion(){
 const q=steps[step], total=questions.length;
 const isProfile=step===0;
 $('#stepText').textContent=isProfile?'이름 입력':(step+' / '+total);
 $('#progressBar').style.width=(isProfile?0:(step/total*100))+'%';
 let body='<div class="eyebrow">'+(isProfile?'BASIC INFO':'QUESTION '+String(step).padStart(2,'0'))+'</div>'+
   '<h1>'+q.title+'</h1>'+(q.desc?'<p class="desc">'+q.desc+'</p>':'');
 if(q.type==='text'){
   body+='<input class="field" id="answerInput" maxlength="30" placeholder="'+(q.placeholder||'')+'" value="'+esc(answers[q.id]||'')+'" />';
 }else if(q.type==='textarea'){
   body+='<textarea id="answerInput" maxlength="120" placeholder="'+(q.placeholder||'')+'">'+esc(answers[q.id]||'')+'</textarea><div class="note">최대 120자</div>';
 }else{
   const selected=answers[q.id]||(q.type==='multi'?[]:'');
   body+='<div class="options">'+q.opts.map(o=>{
     const on=q.type==='multi'?selected.includes(o):selected===o;
     return '<button class="option '+(on?'selected':'')+'" data-value="'+esc(o)+'">'+(q.type==='multi'?'☐ ':'')+esc(o)+'</button>';
   }).join('')+'</div>';
   if(q.id==='learn') body+='<div class="limit-note">선택 '+((answers.learn||[]).length)+' / 3</div>';
   if(q.id==='tools'){
     const custom=answers.customTools||[];
     body+='<div class="other-ai-box"><div class="other-ai-row">'+
       '<input class="field" id="otherAiInput" maxlength="40" placeholder="예: Perplexity, Grok, Midjourney" />'+
       '<button class="add-ai-btn" id="addAiBtn" type="button">+ 다른 AI 추가</button></div>'+
       '<div class="custom-list">'+custom.map((v,i)=>'<button class="custom-chip" type="button" data-custom-index="'+i+'" title="눌러서 삭제">＋ '+esc(v)+' ×</button>').join('')+'</div></div>';
   }
 }
 body+='<div class="nav">'+(step>0?'<button class="secondary" id="prevBtn">이전</button>':'')+
   '<button class="primary" id="nextBtn">'+(step===steps.length-1?'설문 제출':'다음 →')+'</button></div>';
 $('#screen').innerHTML=body;

 if(q.type==='single'){
   document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[q.id]=b.dataset.value;renderQuestion()});
 }else if(q.type==='multi'){
   document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{
     const v=b.dataset.value; let a=answers[q.id]||[];
     if(q.id==='tools'){
       if(v==='잘 모르겠다'){a=['잘 모르겠다'];answers.customTools=[]}
       else{a=a.filter(x=>x!=='잘 모르겠다');a=a.includes(v)?a.filter(x=>x!==v):[...a,v]}
     }else{
       if(q.max && !a.includes(v) && a.length>=q.max){toast('최대 '+q.max+'개까지 선택할 수 있습니다.');return}
       if(q.id==='done' && v==='아직 없음'){a=['아직 없음']}
       else{
         if(q.id==='done') a=a.filter(x=>x!=='아직 없음');
         a=a.includes(v)?a.filter(x=>x!==v):[...a,v];
       }
     }
     answers[q.id]=a; renderQuestion();
   });
 }
 const inp=$('#answerInput'); if(inp) inp.addEventListener('input',e=>answers[q.id]=e.target.value.trim());
 if(q.id==='tools'){
   const add=()=>{
     const input=$('#otherAiInput'); const value=(input.value||'').trim();
     if(!value){toast('추가할 AI 이름을 입력해 주세요.');return}
     const list=answers.customTools||[];
     if(list.some(x=>x.toLowerCase()===value.toLowerCase())){toast('이미 추가한 AI입니다.');return}
     answers.tools=(answers.tools||[]).filter(x=>x!=='잘 모르겠다');
     answers.customTools=[...list,value]; renderQuestion();
   };
   $('#addAiBtn').onclick=add;
   $('#otherAiInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
   document.querySelectorAll('[data-custom-index]').forEach(b=>b.onclick=()=>{
     const i=Number(b.dataset.customIndex); answers.customTools=(answers.customTools||[]).filter((_,idx)=>idx!==i); renderQuestion();
   });
 }
 $('#prevBtn')&&($('#prevBtn').onclick=()=>{step--;renderQuestion()});
 $('#nextBtn').onclick=next;
}
function next(){
 const q=steps[step], v=answers[q.id];
 const empty=q.type==='multi'?!v||!v.length:!v||!String(v).trim();
 if(q.id==='tools'){
   const hasTool=(answers.tools||[]).length||(answers.customTools||[]).length;
   if(answers.aiExp!=='전혀 사용해 본 적이 없다' && !hasTool){toast('사용해 본 AI를 선택하거나 직접 추가해 주세요.');return}
 }else if(q.required&&empty){toast('답변을 선택하거나 입력해 주세요.');return}
 if(step<steps.length-1){step++;renderQuestion()}else submitSurvey();
}
function classify(){
 let score=0;
 const ai=answers.aiExp||'', p=answers.prompt||'', v=answers.verify||'';
 if(ai==='자주 사용한다')score+=3; else if(ai==='가끔 사용한다')score+=2; else if(ai.includes('1~2번'))score+=1;
 if(p.includes('여러 번'))score+=3; else if(p.includes('조건이나 예시'))score+=2; else if(p.includes('같은 질문'))score+=1;
 if(v.includes('다른 자료'))score+=2; else if(v.includes('중요한'))score+=1;
 const done=(answers.done||[]).filter(x=>x!=='아직 없음').length;
 score+=Math.min(2,Math.floor(done/2));
 return score>=8?'AI 활용형 🚀':score>=4?'AI 경험형 🌿':'AI 처음형 🌱';
}
async function submitSurvey(){
 if(isSubmitting) return;
 isSubmitting=true;
 const submitBtn=$('#nextBtn');
 if(submitBtn){
   submitBtn.disabled=true;
   submitBtn.textContent='업로드 중입니다…';
   submitBtn.style.opacity='.65';
   submitBtn.style.cursor='wait';
 }
 const mergedTools=[...(answers.tools||[]),...(answers.customTools||[]).map(v=>'기타: '+v)];
 const rec={id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36),createdAt:new Date().toISOString(),level:classify(),...answers,tools:mergedTools};
 delete rec.customTools;
 const all=getResponses();
 if(!all.some(x=>x.id===rec.id)){all.push(rec);saveResponses(all)}
 let centralSaved=false;
 if(API_URL){
   try{
     const serverRec={...rec,learn:Array.isArray(rec.learn)?rec.learn.join(' | '):rec.learn};
     const result=await apiCall('submit',{record:serverRec});
     centralSaved=!!result.ok;
     if(centralSaved) markCompletedSubmission(rec);
   }catch(e){console.error(e)}
 }
 $('#progressWrap').classList.add('hidden');
 $('#screen').innerHTML=
 '<div class="center hero"><div class="big-emoji">🎉</div><h1>설문이 완료되었습니다.</h1>'+
 '<p class="desc">'+esc(answers.name)+' 님, 감사합니다.<br>답변을 바탕으로 수업 내용과 실습 난이도를 준비하겠습니다.</p>'+
 '<div class="result-card"><div class="eyebrow">추천 학습 시작점</div><b style="font-size:calc(22px * var(--font-scale))">'+classify()+'</b>'+
 '<div class="note">'+(centralSaved?'Google Sheet에 안전하게 한 번만 접수되었습니다.':'현재 기기에 임시 저장되었습니다.')+'</div></div></div>'+
 '<div class="nav"><button class="primary" id="restartBtn">새 설문 시작</button></div>';
 $('#restartBtn').onclick=()=>{isSubmitting=false;answers={customTools:[]};intro()};
}
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function openAdminLogin(){ $('#loginModal').classList.remove('hidden'); $('#passwordInput').value=''; $('#loginMsg').textContent=''; setTimeout(()=>$('#passwordInput').focus(),50)}
async function login(){
 const password=$('#passwordInput').value;
 if(API_URL){
   try{
     $('#loginMsg').textContent='응답을 불러오는 중입니다...';
     const data=await apiCall('list',{password});
     adminPassword=password; adminRows=(data.records||[]).slice().reverse();
     $('#loginModal').classList.add('hidden'); showAdmin(); return;
   }catch(e){
     if(String(e.message).includes('unauthorized')){$('#loginMsg').textContent='비밀번호가 맞지 않습니다.';return}
     $('#loginMsg').textContent='Google Sheet 연결을 확인해 주세요.';return;
   }
 }
 const h=await sha256(password);
 if(h!==ADMIN_HASH){$('#loginMsg').textContent='비밀번호가 맞지 않습니다.';return}
 adminPassword=password; adminRows=getResponses().slice().reverse();
 $('#loginModal').classList.add('hidden'); showAdmin();
}
function showAdmin(){
 $('#surveyShell').classList.add('hidden'); $('#adminShell').classList.remove('hidden'); $('#app').classList.add('admin-mode'); renderAdmin();
}
function showValue(v){
 if(Array.isArray(v)) return v.join(', ');
 return String(v||'').split(' | ').join(', ');
}
function isTodayValue(value){
 const d=new Date(value); const now=new Date();
 if(!isNaN(d)) return d.toDateString()===now.toDateString();
 const s=String(value||'');
 return s.includes(String(now.getFullYear())) && s.includes(String(now.getMonth()+1)) && s.includes(String(now.getDate()));
}
function renderAdmin(){
 const rows=(API_URL?adminRows:getResponses().slice().reverse());
 $('#statTotal').textContent=rows.length;
 $('#statToday').textContent=rows.filter(r=>isTodayValue(r.createdAt)).length;
 $('#statBeginner').textContent=rows.filter(r=>String(r.aiExp||'').includes('전혀')).length;
 $('#adminBody').innerHTML=rows.length?rows.map(r=>'<tr>'+
 '<td>'+esc(r.createdAt||'')+'</td><td><b>'+esc(r.name||'')+'</b><br><span class="note">'+esc(r.level||'')+'</span></td>'+
 '<td>'+esc(r.aiExp||'')+'</td><td>'+esc(showValue(r.tools))+'</td><td>'+esc(showValue(r.purpose))+'</td>'+
 '<td>'+esc(showValue(r.done))+'</td><td>'+esc(showValue(r.learn))+'</td><td>'+esc(r.practice||'')+'</td><td>'+esc(r.goal||'')+'</td></tr>').join(''):
 '<tr><td colspan="9" style="text-align:center;padding:28px;color:#6f7782">아직 저장된 응답이 없습니다.</td></tr>';
}
function exportCSV(){
 const rows=API_URL?adminRows:getResponses(); if(!rows.length){toast('내보낼 응답이 없습니다.');return}
 const head=['접수일시','이름','분류','디지털기기','AI사용빈도','사용AI','질문·수정수준','활용희망','직접해본활동','검증습관','배우고싶은것','노트북지참','수업목표'];
 const data=rows.map(r=>[r.createdAt,r.name,r.level,r.digital,r.aiExp,showValue(r.tools),r.prompt,showValue(r.purpose),showValue(r.done),r.verify,showValue(r.learn),r.practice,r.goal]);
 const csv='\uFEFF'+[head,...data].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='AI_수업_사전설문_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);
}
$('#adminBtn').onclick=openAdminLogin; $('#cancelLogin').onclick=()=>$('#loginModal').classList.add('hidden'); $('#loginBtn').onclick=login;
$('#passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('#backBtn').onclick=()=>{$('#adminShell').classList.add('hidden');$('#surveyShell').classList.remove('hidden');$('#app').classList.remove('admin-mode')};
$('#exportBtn').onclick=exportCSV;
$('#refreshBtn').onclick=async()=>{
 if(API_URL){
   try{const data=await apiCall('list',{password:adminPassword});adminRows=(data.records||[]).slice().reverse();renderAdmin();toast('새로고침했습니다.')}
   catch(e){toast('새로고침에 실패했습니다.')}
 }else renderAdmin();
};
$('#clearBtn').onclick=async()=>{
 if(!confirm('저장된 모든 설문 응답을 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;
 if(API_URL){
   try{await apiCall('clear',{password:adminPassword});adminRows=[];renderAdmin();toast('Google Sheet 응답을 삭제했습니다.')}
   catch(e){toast('삭제에 실패했습니다.')}
 }else{localStorage.removeItem(STORAGE_KEY);renderAdmin();toast('전체 응답을 삭제했습니다.')}
};
bindFontControls();
intro();
</script>
</body>
